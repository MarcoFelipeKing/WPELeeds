<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WPE Earth Day Visual</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom styles for the visual */
        body {
            font-family: 'Inter', sans-serif; /* Ensure Tailwind's default font */
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh; /* Use min-height for flexibility */
            background-color: #f0fdf4; /* Light green background for Earth Day feel */
        }
        .visual-container {
            position: relative; /* Needed for absolute positioning of circles */
            width: 300px; /* Adjust size as needed */
            height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .circle {
            position: absolute;
            border-radius: 50%;
            opacity: 0.6; /* Transparency for overlap effect */
            display: flex;
            flex-direction: column; /* Stack icon and text */
            align-items: center;
            justify-content: center;
            text-align: center;
            color: white;
            font-weight: 600;
            font-size: 0.8rem; /* Smaller text */
            padding: 10px; /* Padding inside circle */
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1); /* Subtle shadow */
            transition: all 0.3s ease; /* Smooth transition */
        }

        /* Specific positions and colors */
        .circle-water {
            width: 150px;
            height: 150px;
            background-color: #3b82f6; /* Blue-500 */
            top: 10%;
            left: 10%;
        }
        .circle-health {
            width: 150px;
            height: 150px;
            background-color: #ef4444; /* Red-500 */
            top: 10%;
            right: 10%;
        }
        .circle-env {
            width: 150px;
            height: 150px;
            background-color: #22c55e; /* Green-500 */
            bottom: 10%;
            /* Center horizontally - calculated */
            left: 50%;
            transform: translateX(-50%);
        }

        /* Icon styles */
        .circle svg {
            width: 40px; /* Icon size */
            height: 40px;
            margin-bottom: 5px; /* Space between icon and text */
            fill: white;
        }

        /* Center text/logo */
        .center-text {
            position: absolute;
            font-size: 1.5rem; /* Larger font size */
            font-weight: bold;
            color: #1f2937; /* Dark Gray */
            z-index: 10; /* Ensure it's above circles */
            background-color: rgba(255, 255, 255, 0.7); /* Semi-transparent white background */
            padding: 8px 12px;
            border-radius: 8px; /* Rounded corners */
        }

         /* Hover effect */
        .circle:hover {
            opacity: 0.8;
            transform: scale(1.05);
         }

         /* Responsive adjustments */
         @media (max-width: 400px) {
            .visual-container {
                width: 250px;
                height: 250px;
            }
            .circle {
                width: 120px;
                height: 120px;
                font-size: 0.7rem;
            }
             .circle svg {
                width: 30px;
                height: 30px;
            }
            .center-text {
                font-size: 1.2rem;
            }
         }

    </style>
</head>
<body>
    <div class="visual-container">
        <div class="circle circle-water">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.00098C7.02944 2.00098 3 6.03041 3 11.001C3 15.9715 8.96881 21.2137 11.3859 21.8845C11.7709 21.9912 12.2291 21.9912 12.6141 21.8845C15.0312 21.2137 21 15.9715 21 11.001C21 6.03041 16.9706 2.00098 12 2.00098ZM12 18.001C10.8954 18.001 10 17.1056 10 16.001C10 14.8964 12 11.001 12 11.001C12 11.001 14 14.8964 14 16.001C14 17.1056 13.1046 18.001 12 18.001Z"></path></svg>
            <span>Water</span>
        </div>

        <div class="circle circle-health">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M16.5 3C19.5376 3 22 5.5 22 9C22 16 14.5 20 12 21.5C9.5 20 2 16 2 9C2 5.5 4.5 3 7.5 3C9.35997 3 11 4 12 5C13 4 14.64 3 16.5 3Z"></path></svg>
            <span>Public Health</span>
        </div>

        <div class="circle circle-env">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M16.6667 2C19.6107 2 22 4.38934 22 7.33333C22 10.2773 19.6107 12.6667 16.6667 12.6667C16.1812 12.6667 15.711 12.6087 15.2611 12.5C16.1614 11.697 16.7947 10.6177 17.0737 9.41667H19.3333C19.7015 9.41667 20 9.11819 20 8.75C20 8.38181 19.7015 8.08333 19.3333 8.08333H16.4218C16.1897 6.84323 15.5804 5.73362 14.6667 4.86533V2.66667C15.403 2.92467 16.0242 3.42667 16.4333 4.08333C16.6609 4.41113 17.107 4.51192 17.4348 4.2843C17.7626 4.05668 17.8634 3.61058 17.6358 3.28278C17.06 2.451 16.1667 1.83333 15.1667 1.5V13.3333C15.1667 18.138 11.3047 22 6.5 22C1.69533 22 -2.16667 18.138 -2.16667 13.3333C-2.16667 10.9447 -1.29467 8.794 -0.0153333 7.16667L8.83333 16.8333L13.1667 12.5V4.86533C12.253 5.73362 11.6437 6.84323 11.4116 8.08333H8.66667C8.29848 8.08333 8 8.38181 8 8.75C8 9.11819 8.29848 9.41667 8.66667 9.41667H10.76C11.039 10.6177 11.6723 11.697 12.5726 12.5C12.1227 12.6087 11.6525 12.6667 11.1667 12.6667C8.22267 12.6667 5.83333 10.2773 5.83333 7.33333C5.83333 4.38934 8.22267 2 11.1667 2C12.7983 2 14.273 2.67367 15.3137 3.77067C15.9877 3.11833 16.8333 2.66667 16.6667 2Z"></path></svg>
            <span>Environment</span>
        </div>

        <div class="center-text">
            WPE
        </div>
    </div>

</body>
</html>
